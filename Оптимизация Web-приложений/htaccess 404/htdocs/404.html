<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>404 — Страница не найдена</title>
<style>
  body { font-family: Arial, sans-serif; background: #0F172A;
         display: flex; align-items: center; justify-content: center;
         height: 100vh; margin: 0; text-align: center; }
  .box { background: #243249; padding: 40px 60px; border-radius: 12px;
         box-shadow: 0 6px 45px rgba(0,0,0,.6); }
  h1 { font-size: 80px; margin: 0; color: #e74c3c; }
  p { color: #F1F5F9; font-size: 18px; }
  a { display: inline-block; margin-top: 15px; padding: 10px 25px;
      background: #3498db; color: #fff; text-decoration: none;
      border-radius: 6px; }
  a:hover { background: #2980b9; }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Упс! Такой страницы не существует.</p>
    <a href="/">На главную</a>
  </div>
</body>
</html>
